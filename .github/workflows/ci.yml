name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Format check
        run: npm run web:format:check
      - name: Lint
        run: npm run web:lint
      - name: Build
        run: npm run web:build
      - name: Test
        run: npm run web:test

  api:
    name: API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore tools
        run: dotnet tool restore
        working-directory: api
      - name: Format check
        run: npm run api:format:check
      - name: Build
        run: npm run api:build
      - name: Test
        run: npm run api:test:unit

  api-integration:
    name: API Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore tools
        run: dotnet tool restore
        working-directory: api
      - name: Build
        run: npm run api:build
      - name: Integration tests
        run: npm run api:test:integration

  api-docker:
    name: API Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            e2e/package-lock.json
            web/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Restore dotnet tools
        run: dotnet tool restore
        working-directory: api
      - name: Install e2e deps
        run: npm ci
        working-directory: e2e
      - name: Lint e2e
        run: npm run e2e:lint
      - name: Start E2E Supabase stack
        run: supabase start
        working-directory: e2e/supabase
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run E2E tests
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 14
      - name: Stop E2E Supabase stack
        if: always()
        run: supabase stop
        working-directory: e2e/supabase
